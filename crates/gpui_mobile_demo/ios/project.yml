name: GpuimmMobile
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  GpuimmMobile:
    type: application
    platform: iOS
    sources:
      - path: App.swift
      - path: GpuimmView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gpuimm.mobile
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_OBJC_BRIDGING_HEADER: ../include/gpuimm.h
        LIBRARY_SEARCH_PATHS: "$(inherited) $(GPUIMM_LIBRARY_DIR)"
        OTHER_LDFLAGS: "$(inherited) -lgpui_mobile_demo -framework Metal -framework QuartzCore -framework CoreGraphics -framework CoreText -framework Security -liconv"
  GpuimmMobileTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests.swift
    dependencies:
      - target: GpuimmMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gpuimm.mobile.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  GpuimmMobile:
    build:
      targets:
        GpuimmMobile: all
    test:
      targets:
        - GpuimmMobileTests
